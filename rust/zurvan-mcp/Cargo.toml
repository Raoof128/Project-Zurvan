[package]
name = "zurvan-mcp"
version = "3.0.0"
edition = "2021"
rust-version = "1.97"
description = "Zurvan knowledge engine MCP server (stdio), drop-in for scripts/mcp_server.py"
publish = false

[lib]
name = "zurvan_mcp"
path = "src/lib.rs"

[[bin]]
name = "zurvan-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "=3.5.1", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "io-std", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
anyhow = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rayon = "1.12"
memmap2 = "0.9"
sha2 = "0.10"
regex = "1.13"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
tokenizers = { version = "0.22", default-features = false, features = ["onig"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
